<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Skąd nazwa choroby sierpowatej?</title><desc id="desc">Porównanie dwuwklęsłej krwinki czerwonej i schematycznej krwinki o kształcie sierpa.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Hemoglobina i kształt krwinki</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">W chorobie sierpowatej HbS może tworzyć włókna przy niedotlenieniu.</text><circle cx="206" cy="235" r="74" fill="#f9e6d9" stroke="#e56640" stroke-width="4"/><circle cx="206" cy="235" r="32" fill="#f7f5ee"/><path d="M548 162C650 166 689 278 613 315C644 236 591 218 548 162Z" fill="#f9e6d9" stroke="#e56640" stroke-width="4"/><text x="206" y="347" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">krwinka dwuwklęsła</text><text x="607" y="347" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">możliwy kształt sierpa</text><path d="M315 235L476 235" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><text x="400" y="400" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Kształt zależy m.in. od warunków i zawartości HbS.</text><text x="400" y="433" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Nie każda krwinka stale ma kształt sierpa.</text></g></svg>
