<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Jak może zmienić się sekwencja DNA?</title><desc id="desc">Sekwencja ACGT zmienia się przez substytucję w ATGT, przez delecję w AGT albo przez insercję w ACAGT.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Warianty DNA: trzy proste przykłady</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Zmiana zapisu nie musi oznaczać choroby.</text><text x="55" y="143" text-anchor="start" font-size="21" font-weight="400" fill="#28382f">wyjściowo</text><text x="425" y="143" text-anchor="middle" font-size="30" font-weight="600" fill="#28382f">A  C  G  T</text><rect x="36" y="182" width="728" height="58" rx="16" fill="#edf0e4"/><text x="55" y="218" text-anchor="start" font-size="21" font-weight="400" fill="#28382f">zamiana zasady</text><text x="440" y="218" text-anchor="middle" font-size="28" font-weight="600" fill="#e56640">A  T  G  T</text><rect x="36" y="257" width="728" height="58" rx="16" fill="#edf0e4"/><text x="55" y="293" text-anchor="start" font-size="21" font-weight="400" fill="#28382f">delecja</text><text x="440" y="293" text-anchor="middle" font-size="28" font-weight="600" fill="#e56640">A  G  T</text><rect x="36" y="332" width="728" height="58" rx="16" fill="#edf0e4"/><text x="55" y="368" text-anchor="start" font-size="21" font-weight="400" fill="#28382f">insercja</text><text x="440" y="368" text-anchor="middle" font-size="28" font-weight="600" fill="#e56640">A  C  A  G  T</text><text x="400" y="429" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">To fragmenty jednej nici; litery oznaczają zasady.</text></g></svg>
