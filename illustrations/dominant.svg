<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Jak może być przekazany wariant dominujący?</title><desc id="desc">Rodzic Aa i rodzic aa mogą mieć dziecko Aa lub aa, z równą szansą w każdej ciąży.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Dziedziczenie dominujące: Aa × aa</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Przykład: jeden rodzic ma wariant dominujący A.</text><text x="240" y="150" text-anchor="middle" font-size="23" font-weight="400" fill="#28382f">rodzic Aa</text><text x="565" y="150" text-anchor="middle" font-size="23" font-weight="400" fill="#28382f">rodzic aa</text><rect x="140" y="180" width="90" height="65" rx="16" fill="#f9e6d9"/><text x="185.0" y="221" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">A</text><rect x="260" y="180" width="90" height="65" rx="16" fill="#edf0e4"/><text x="305.0" y="221" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">a</text><rect x="465" y="180" width="90" height="65" rx="16" fill="#edf0e4"/><text x="510.0" y="221" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">a</text><rect x="585" y="180" width="90" height="65" rx="16" fill="#edf0e4"/><text x="630.0" y="221" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">a</text><path d="M240 262L400 287" stroke="#4b655b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M565 262L400 287" stroke="#4b655b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M400 287L240 315" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><path d="M400 287L565 315" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><rect x="140" y="320" width="200" height="65" rx="16" fill="#f9e6d9"/><text x="240.0" y="361" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">Aa</text><rect x="465" y="320" width="200" height="65" rx="16" fill="#edf0e4"/><text x="565.0" y="361" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">aa</text><text x="240" y="412" text-anchor="middle" font-size="21" font-weight="400" fill="#28382f">50% z wariantem A</text><text x="565" y="412" text-anchor="middle" font-size="21" font-weight="400" fill="#28382f">50% bez wariantu A</text><text x="400" y="446" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Szansa dotyczy każdej ciąży osobno.</text></g></svg>
