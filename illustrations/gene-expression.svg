<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Jak komórka odczytuje gen?</title><desc id="desc">Schemat DNA prowadzi przez transkrypcję do RNA, a następnie przez translację do białka.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Od genu do białka</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Uproszczony przepływ informacji dla genu kodującego białko.</text><rect x="45" y="175" width="170" height="65" rx="16" fill="#f9e6d9"/><text x="130.0" y="216" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">DNA</text><rect x="315" y="175" width="170" height="65" rx="16" fill="#edf0e4"/><text x="400.0" y="216" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">RNA</text><rect x="585" y="175" width="170" height="65" rx="16" fill="#f9e6d9"/><text x="670.0" y="216" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">białko</text><path d="M229 208L297 208" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><path d="M499 208L567 208" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><text x="265" y="286" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">transkrypcja</text><text x="535" y="286" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">translacja</text><text x="130" y="343" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">zapis informacji</text><text x="400" y="343" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">kopia robocza</text><text x="670" y="343" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">cząsteczka</text><text x="670" y="373" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">pełniąca funkcję</text><text x="400" y="426" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Część genów tworzy funkcjonalne RNA, a nie białka.</text></g></svg>
