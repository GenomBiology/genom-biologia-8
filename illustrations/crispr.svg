<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Jak działa narzędzie CRISPR-Cas9?</title><desc id="desc">RNA przewodnik kieruje białko Cas9 do DNA; zaznaczone miejsce cięcia prowadzi do naprawy przez komórkę.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">CRISPR: rozpoznanie, cięcie, naprawa</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Przykład narzędzia Cas9 — skutki zależą od sposobu naprawy DNA.</text><path d="M65 236L735 236" stroke="#e56640" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M65 258L735 258" stroke="#4b655b" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="288" y="155" width="213" height="140" rx="24" fill="#edf0e4" stroke="#4b655b" stroke-width="2"/><text x="395" y="190" text-anchor="middle" font-size="22" font-weight="600" fill="#28382f">białko Cas9</text><path d="M214 141H381Q410 141 410 215" fill="none" stroke="#6c8c99" stroke-width="6"/><text x="190" y="119" text-anchor="middle" font-size="21" font-weight="400" fill="#6c8c99">RNA przewodnik</text><path d="M405 216L405 275" stroke="#28382f" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="5 6"/><text x="596" y="187" text-anchor="middle" font-size="21" font-weight="400" fill="#28382f">miejsce cięcia</text><path d="M515 183L416 228" stroke="#53634f" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M398 311L398 345" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><text x="400" y="382" text-anchor="middle" font-size="23" font-weight="400" fill="#28382f">komórkowa naprawa DNA</text><text x="400" y="427" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Edycja nie gwarantuje dowolnej ani bezbłędnej zmiany.</text></g></svg>
