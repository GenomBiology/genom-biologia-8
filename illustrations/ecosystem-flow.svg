ke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M381 218H449" fill="none" stroke="#4b655b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M551 218H619" fill="none" stroke="#4b655b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="290" y="322" width="250" height="64" rx="12" fill="#e9eddd"/><text x="415" y="348" font-size="22" font-weight="600" fill="#28382f" text-anchor="middle">destruenci</text><text x="415" y="375" font-size="20" font-weight="400" fill="#53634f" text-anchor="middle">bakterie i grzyby</text><path d="M719 239C769 252 777 270 777 302V346Q777 375 552 364" fill="none" stroke="#4b655b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arr)"/><text x="654" y="310" font-size="20" font-weight="400" fill="#53634f" text-anchor="middle">martwa materia</text><text x="654" y="336" font-size="20" font-weight="400" fill="#53634f" text-anchor="middle">z każdego poziomu</text><path d="M289 354C105 391 89 301 139 257" fill="none" stroke="#4b655b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arr)"/><text x="119" y="383" font-size="20" font-weight="400" fill="#53634f" text-anchor="middle">sole mineralne</text><text x="400" y="432" font-size="20" font-weight="400" fill="#53634f" text-anchor="middle">Materia krąży. Energia przepływa i rozprasza się jako ciepło.</text></g></svg>