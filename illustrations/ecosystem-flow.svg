<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Łańcuch pokarmowy i obieg materii</title><desc id="desc">Energia słoneczna trafia do trawy. Strzałki pokarmowe prowadzą od trawy do konika polnego, żaby i bociana. Martwa materia ze wszystkich poziomów trafia do destruentów; po rozkładzie sole mineralne wracają do roślin.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" font-size="29" font-weight="600" fill="#28382f" text-anchor="start">Łańcuch pokarmowy i obieg materii</text><text x="38" y="82" font-size="20" font-weight="400" fill="#53634f" text-anchor="start">Strzałka pokarmowa: od pokarmu do konsumenta.</text><text x="160" y="132" font-size="20" font-weight="400" fill="#53634f" text-anchor="middle">producent</text><text x="500" y="132" font-size="20" font-weight="400" fill="#53634f" text-anchor="middle">konsumenci</text><path d="M286 149H714 M286 149v8 M714 149v8" fill="none" stroke="#4b655b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="145" r="17" fill="#e8ba77"/><path d="M48 117v-9 M48 173v9 M20 145h-9 M76 145h9 M28 125l-6-6 M68 165l6 6 M28 165l-6 6 M68 125l6-6" fill="none" stroke="#d6a35c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="49" y="202" font-size="20" font-weight="400" fill="#53634f" text-anchor="middle">światło</text><path d="M77 159 120 185" fill="none" stroke="#4b655b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><circle cx="160" cy="218" r="43" fill="#edf0e2"/><circle cx="330" cy="218" r="43" fill="#edf0e2"/><circle cx="500" cy="218" r="43" fill="#edf0e2"/><circle cx="670" cy="218" r="43" fill="#edf0e2"