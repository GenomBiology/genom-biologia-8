<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Jak działa dziedziczenie recesywne?</title><desc id="desc">Krzyżówka Aa na Aa pokazuje AA, Aa, Aa i aa oraz proporcje 25, 50 i 25 procent.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Dziedziczenie recesywne: Aa × Aa</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Przykład: oboje rodzice mają jedną kopię wariantu a.</text><text x="350" y="126" text-anchor="middle" font-size="27" font-weight="600" fill="#28382f">A</text><text x="510" y="126" text-anchor="middle" font-size="27" font-weight="600" fill="#28382f">a</text><text x="230" y="204" text-anchor="middle" font-size="27" font-weight="600" fill="#28382f">A</text><text x="230" y="304" text-anchor="middle" font-size="27" font-weight="600" fill="#28382f">a</text><rect x="278" y="151" width="145" height="90" rx="16" fill="#edf0e4"/><text x="350" y="207" text-anchor="middle" font-size="29" font-weight="600" fill="#28382f">AA</text><rect x="438" y="151" width="145" height="90" rx="16" fill="#f9e6d9"/><text x="510" y="207" text-anchor="middle" font-size="29" font-weight="600" fill="#28382f">Aa</text><rect x="278" y="251" width="145" height="90" rx="16" fill="#f9e6d9"/><text x="350" y="307" text-anchor="middle" font-size="29" font-weight="600" fill="#28382f">Aa</text><rect x="438" y="251" width="145" height="90" rx="16" fill="#e9b4a0"/><text x="510" y="307" text-anchor="middle" font-size="29" font-weight="600" fill="#28382f">aa</text><text x="400" y="383" text-anchor="middle" font-size="23" font-weight="400" fill="#28382f">25% AA  •  50% Aa  •  25% aa</text><text x="400" y="420" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Dla każdej ciąży osobno; A i a to dwie wersje genu.</text></g></svg>
