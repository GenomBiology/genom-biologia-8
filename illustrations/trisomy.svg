<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Co oznacza trisomia?</title><desc id="desc">Po lewej dwie kopie wybranego chromosomu, po prawej trzy kopie.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Trisomia: trzy kopie zamiast dwóch</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Schemat jednej grupy chromosomów, nie pełny kariotyp.</text><rect x="50" y="128" width="315" height="220" rx="16" fill="#edf0e4"/><rect x="435" y="128" width="315" height="220" rx="16" fill="#f9e6d9"/><g transform="translate(155 238) scale(0.9)" stroke="#4b655b" stroke-width="17" stroke-linecap="round" fill="none"><path d="M-25-48 25 48M25-48-25 48"/></g><g transform="translate(260 238) scale(0.9)" stroke="#4b655b" stroke-width="17" stroke-linecap="round" fill="none"><path d="M-25-48 25 48M25-48-25 48"/></g><g transform="translate(510 238) scale(0.9)" stroke="#e56640" stroke-width="17" stroke-linecap="round" fill="none"><path d="M-25-48 25 48M25-48-25 48"/></g><g transform="translate(590 238) scale(0.9)" stroke="#e56640" stroke-width="17" stroke-linecap="round" fill="none"><path d="M-25-48 25 48M25-48-25 48"/></g><g transform="translate(670 238) scale(0.9)" stroke="#e56640" stroke-width="17" stroke-linecap="round" fill="none"><path d="M-25-48 25 48M25-48-25 48"/></g><text x="208" y="325" text-anchor="middle" font-size="23" font-weight="600" fill="#28382f">2 kopie</text><text x="592" y="325" text-anchor="middle" font-size="23" font-weight="600" fill="#28382f">3 kopie</text><text x="400" y="393" text-anchor="middle" font-size="21" font-weight="400" fill="#28382f">Trisomia może dotyczyć różnych chromosomów.</text><text x="400" y="428" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Np. 21 — zespół Downa; 18 — Edwardsa; 13 — Pataua.</text></g></svg>
