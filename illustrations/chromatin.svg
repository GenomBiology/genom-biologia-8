<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Jak DNA mieści się w jądrze?</title><desc id="desc">Trzy zespoły histonów oplecione nicią DNA, przedstawione jako paciorki na nici.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Chromatyna: DNA i białka</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Nić DNA owija się wokół zespołów histonów.</text><circle cx="185" cy="235" r="48" fill="#4b655b"/><path d="M119 235C127 155 243 155 250 228C242 305 129 305 121 239" fill="none" stroke="#e56640" stroke-width="7"/><path d="M250 228Q288 188 329 235" fill="none" stroke="#e56640" stroke-width="7"/><circle cx="395" cy="235" r="48" fill="#4b655b"/><path d="M329 235C337 155 453 155 460 228C452 305 339 305 331 239" fill="none" stroke="#e56640" stroke-width="7"/><path d="M460 228Q498 188 539 235" fill="none" stroke="#e56640" stroke-width="7"/><circle cx="605" cy="235" r="48" fill="#4b655b"/><path d="M539 235C547 155 663 155 670 228C662 305 549 305 541 239" fill="none" stroke="#e56640" stroke-width="7"/><path d="M187 287L187 335" stroke="#4b655b" stroke-width="2" fill="none" stroke-linecap="round"/><text x="187" y="366" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">histony</text><path d="M452 206L510 138" stroke="#e56640" stroke-width="2" fill="none" stroke-linecap="round"/><text x="548" y="136" text-anchor="middle" font-size="22" font-weight="400" fill="#e56640">DNA</text><text x="400" y="420" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">DNA + histony = nukleosom; razem tworzą chromatynę.</text></g></svg>
