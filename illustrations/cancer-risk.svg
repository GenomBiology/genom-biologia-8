<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Wariant genetyczny a ryzyko nowotworu</title><desc id="desc">Wariant genu wiąże się ze zmienionym ryzykiem, na które wpływają także inne geny, wiek i środowisko.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Predyspozycja nie oznacza pewności</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Wariant może zwiększać ryzyko, ale nie przesądza o przyszłości.</text><rect x="56" y="162" width="210" height="65" rx="16" fill="#f9e6d9"/><text x="161.0" y="203" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">wariant genu</text><path d="M281 194L368 194" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><rect x="392" y="140" width="330" height="110" rx="16" fill="#edf0e4"/><text x="557" y="185" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">zmienione ryzyko</text><text x="557" y="219" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">w określonym kontekście</text><circle cx="170" cy="329" r="35" fill="#f9e6d9"/><text x="170" y="398" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">inne geny</text><circle cx="400" cy="329" r="35" fill="#f9e6d9"/><text x="400" y="398" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">wiek</text><circle cx="630" cy="329" r="35" fill="#f9e6d9"/><text x="630" y="398" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">środowisko</text><text x="400" y="442" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Ocena ryzyka wymaga danych o wariancie i historii rodzinnej.</text></g></svg>
