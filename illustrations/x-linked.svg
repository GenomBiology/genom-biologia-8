<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Jak wariant może być związany z chromosomem X?</title><desc id="desc">Krzyżówka matki XAXa i ojca XAY z czterema układami: XAXA, XAY, XAXa oraz XaY.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Przykład recesywnego dziedziczenia X</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Matka XᴬXᵃ × ojciec XᴬY; układy dotyczą każdej ciąży osobno.</text><text x="349" y="133" text-anchor="middle" font-size="27" font-weight="600" fill="#28382f">Xᴬ</text><text x="566" y="133" text-anchor="middle" font-size="27" font-weight="600" fill="#28382f">Y</text><text x="190" y="219" text-anchor="middle" font-size="27" font-weight="600" fill="#28382f">Xᴬ</text><text x="190" y="325" text-anchor="middle" font-size="27" font-weight="600" fill="#28382f">Xᵃ</text><rect x="246" y="155" width="205" height="98" rx="16" fill="#edf0e4"/><text x="348" y="194" text-anchor="middle" font-size="25" font-weight="600" fill="#28382f">XᴬXᴬ</text><text x="348" y="231" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">córka</text><rect x="464" y="155" width="205" height="98" rx="16" fill="#edf0e4"/><text x="566" y="194" text-anchor="middle" font-size="25" font-weight="600" fill="#28382f">XᴬY</text><text x="566" y="231" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">syn</text><rect x="246" y="260" width="205" height="98" rx="16" fill="#f9e6d9"/><text x="348" y="299" text-anchor="middle" font-size="25" font-weight="600" fill="#28382f">XᴬXᵃ</text><text x="348" y="336" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">córka z wariantem</text><rect x="464" y="260" width="205" height="98" rx="16" fill="#f9e6d9"/><text x="566" y="299" text-anchor="middle" font-size="25" font-weight="600" fill="#28382f">XᵃY</text><text x="566" y="336" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">syn z wariantem</text><text x="400" y="397" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Każde pole: 25% w tym uproszczonym modelu.</text><text x="400" y="431" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">U kobiet z wariantem również mogą występować objawy.</text></g></svg>
