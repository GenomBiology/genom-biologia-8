<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Co zmienia się w epigenetyce?</title><desc id="desc">Nić DNA z niezmienionymi literami i przyłączonymi grupami metylowymi CH3.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Epigenetyka: regulacja bez zmiany liter</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Znaczniki i upakowanie DNA mogą wiązać się z aktywnością genów.</text><rect x="75" y="218" width="60" height="65" rx="16" fill="#edf0e4"/><text x="105.0" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">A</text><rect x="160" y="218" width="60" height="65" rx="16" fill="#edf0e4"/><text x="190.0" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">T</text><rect x="245" y="218" width="60" height="65" rx="16" fill="#edf0e4"/><text x="275.0" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">C</text><rect x="330" y="218" width="60" height="65" rx="16" fill="#edf0e4"/><text x="360.0" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">A</text><rect x="415" y="218" width="60" height="65" rx="16" fill="#edf0e4"/><text x="445.0" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">C</text><rect x="500" y="218" width="60" height="65" rx="16" fill="#edf0e4"/><text x="530.0" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">G</text><rect x="585" y="218" width="60" height="65" rx="16" fill="#edf0e4"/><text x="615.0" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">A</text><rect x="670" y="218" width="60" height="65" rx="16" fill="#edf0e4"/><text x="700.0" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">T</text><path d="M102 205L698 205" stroke="#4b655b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M275 205L275 161" stroke="#e56640" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="275" cy="135" r="27" fill="#f9e6d9" stroke="#e56640" stroke-width="3"/><text x="275" y="143" text-anchor="middle" font-size="20" font-weight="400" fill="#e56640">CH₃</text><path d="M445 205L445 161" stroke="#e56640" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="445" cy="135" r="27" fill="#f9e6d9" stroke="#e56640" stroke-width="3"/><text x="445" y="143" text-anchor="middle" font-size="20" font-weight="400" fill="#e56640">CH₃</text><text x="400" y="337" text-anchor="middle" font-size="23" font-weight="400" fill="#28382f">Sekwencja zasad pozostaje taka sama.</text><text x="400" y="381" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Znaczenie metylacji zależy od miejsca i kontekstu.</text><text x="400" y="425" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Nie jest to prosty przełącznik „dobry / zły gen”.</text></g></svg>
