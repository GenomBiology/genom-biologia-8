<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Trzy poziomy różnorodności biologicznej</title><desc id="desc">Różnorodność genetyczna oznacza różnice w obrębie gatunku. Różnorodność gatunkowa obejmuje różne gatunki. Różnorodność ekosystemów to między innymi las, jezioro i łąka.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" font-size="29" font-weight="600" fill="#28382f" text-anchor="start">Trzy poziomy różnorodności biologicznej</text><text x="38" y="82" font-size="20" font-weight="400" fill="#53634f" text-anchor="start">Ochrona siedlisk wspiera wszystkie trzy poziomy.</text><rect x="38" y="119" width="208" height="224" rx="16" fill="#eef0e3"/><rect x="296" y="119" width="208" height="224" rx="16" fill="#eef0e3"/><rect x="554" y="119" width="208" height="224" rx="16" fill="#eef0e3"/><text x="142" y="158" font-size="23" font-weight="600" fill="#28382f" text-anchor="middle">Geny</text><text x="400" y="158" font-size="23" font-weight="600" fill="#28382f" text-anchor="middle">Gatunki</text><text x="658" y="158" font-size="23" font-weight="600" fill="#28382f" text-anchor="middle">Ekosystemy</text><g transform="translate(93 227) scale(0.9)"><ellipse rx="21" ry="12" fill="#73966a"/><path d="M-16 0-33-14v28Z" fill="#73966a"/><circle cx="12" cy="-3" r="2.5" fill="#28382f"/></g><g transform="translate(151 227) scale(0.9)"><ellipse rx="21" ry="12" fill="#ba895b"/><path d="M-16 0-33-14v28Z" fill="#ba895b"/><circle cx="12" cy="-3" r="2.5" fill="#28382f"/></g><g transform="translate(209 227) scale(0.9)"><ellipse rx="21" ry="12" fill="#8a9b9a"/><path d="M-16 0-33-14v28Z" fill="#8a9b9a"/><circle cx="12" cy="-3" r="2.5" fill="#28382f"/></g><tex