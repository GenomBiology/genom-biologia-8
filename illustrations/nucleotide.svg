<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Z czego składa się nukleotyd?</title><desc id="desc">Trzy połączone elementy nukleotydu: reszta fosforanowa, deoksyryboza oraz zasada A, T, G lub C.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Nukleotyd: trzy części</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Jednostka budująca nić DNA.</text><circle cx="150" cy="225" r="53" fill="#f9e6d9" stroke="#e56640" stroke-width="3"/><text x="150" y="234" text-anchor="middle" font-size="34" font-weight="600" fill="#e56640">P</text><path d="M300 165 363 188 352 255 281 273 246 212Z" fill="#edf0e4" stroke="#4b655b" stroke-width="3"/><rect x="472" y="182" width="190" height="85" rx="16" fill="#f9e6d9"/><text x="567" y="233" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">A / T / G / C</text><path d="M205 225L260 220" stroke="#4b655b" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M361 217L472 217" stroke="#4b655b" stroke-width="4" fill="none" stroke-linecap="round"/><text x="150" y="332" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">reszta</text><text x="150" y="361" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">fosforanowa</text><text x="305" y="332" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">cukier:</text><text x="305" y="361" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">deoksyryboza</text><text x="566" y="332" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">zasada</text><text x="566" y="361" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">azotowa</text><text x="400" y="420" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Cukier i fosforan tworzą szkielet nici.</text></g></svg>
