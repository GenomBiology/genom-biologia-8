<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Jak czytać schemat chromosomu?</title><desc id="desc">Chromosom w kształcie X: dwie chromatydy siostrzane połączone w centromerze.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Chromosom po replikacji</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Dwie chromatydy siostrzane zawierają kopie DNA.</text><g transform="translate(395 230) scale(1.8)" stroke="#e56640" stroke-width="17" stroke-linecap="round" fill="none"><path d="M-25-48 25 48M25-48-25 48"/></g><text x="157" y="169" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">chromatyda</text><text x="157" y="197" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">siostrzana</text><path d="M245 185L345 185" stroke="#4b655b" stroke-width="2" fill="none" stroke-linecap="round"/><text x="625" y="169" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">chromatyda</text><text x="625" y="197" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">siostrzana</text><path d="M550 185L448 185" stroke="#4b655b" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="395" cy="230" r="11" fill="#28382f"/><path d="M411 237L547 300" stroke="#4b655b" stroke-width="2" fill="none" stroke-linecap="round"/><text x="621" y="316" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">centromer</text><text x="400" y="390" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Kształt „X” jest widoczny podczas podziału.</text><text x="400" y="420" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Chromosomy przez większość czasu są rozluźnione.</text></g></svg>
