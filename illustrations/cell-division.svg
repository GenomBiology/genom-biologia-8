<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Dwa sposoby podziału komórki</title><desc id="desc">Mitoza daje dwie komórki 2n, a mejoza cztery komórki n w uproszczonym schemacie.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Mitoza i mejoza: różne rezultaty</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Schemat pokazuje liczbę zestawów chromosomów, nie ich wygląd.</text><text x="120" y="145" text-anchor="middle" font-size="23" font-weight="600" fill="#4b655b">MITOZA</text><circle cx="130" cy="215" r="34" fill="#f9e6d9"/><text x="130" y="223" text-anchor="middle" font-size="24" font-weight="400" fill="#28382f">2n</text><path d="M185 215L296 215" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><circle cx="375" cy="215" r="34" fill="#edf0e4"/><text x="375" y="223" text-anchor="middle" font-size="24" font-weight="400" fill="#28382f">2n</text><circle cx="490" cy="215" r="34" fill="#edf0e4"/><text x="490" y="223" text-anchor="middle" font-size="24" font-weight="400" fill="#28382f">2n</text><text x="658" y="208" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">2 komórki</text><text x="658" y="238" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">somatyczne</text><text x="120" y="307" text-anchor="middle" font-size="23" font-weight="600" fill="#e56640">MEJOZA</text><circle cx="130" cy="365" r="34" fill="#f9e6d9"/><text x="130" y="373" text-anchor="middle" font-size="24" font-weight="400" fill="#28382f">2n</text><path d="M185 365L296 365" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><circle cx="340" cy="365" r="27" fill="#edf0e4"/><text x="340" y="373" text-anchor="middle" font-size="24" font-weight="400" fill="#28382f">n</text><circle cx="420" cy="365" r="27" fill="#edf0e4"/><text x="420" y="373" text-anchor="middle" font-size="24" font-weight="400" fill="#28382f">n</text><circle cx="500" cy="365" r="27" fill="#edf0e4"/><text x="500" y="373" text-anchor="middle" font-size="24" font-weight="400" fill="#28382f">n</text><circle cx="580" cy="365" r="27" fill="#edf0e4"/><text x="580" y="373" text-anchor="middle" font-size="24" font-weight="400" fill="#28382f">n</text><text x="706" y="357" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">4 komórki</text><text x="706" y="386" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">haploidalne</text><text x="400" y="438" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">n oznacza jeden zestaw chromosomów.</text></g></svg>
