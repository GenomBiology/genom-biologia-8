<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Jak DNA kopiuje samo siebie?</title><desc id="desc">Jedna para starych zielonych nici staje się dwiema parami, każda z jedną zieloną i jedną nową pomarańczową nicią.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Replikacja: kopia z wzorcem</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Każda nowa cząsteczka zawiera jedną starą i jedną nową nić.</text><path d="M75 185L255 185" stroke="#4b655b" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M75 211L255 211" stroke="#4b655b" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M281 198L362 198" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><path d="M430 151L700 151" stroke="#4b655b" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M430 177L700 177" stroke="#e56640" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M430 280L700 280" stroke="#4b655b" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M430 306L700 306" stroke="#e56640" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M377 198L410 164" stroke="#d9dfce" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M377 198L410 292" stroke="#d9dfce" stroke-width="3" fill="none" stroke-linecap="round"/><text x="165" y="280" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">DNA wyjściowe</text><text x="565" y="365" text-anchor="middle" font-size="22" font-weight="400" fill="#28382f">dwie cząsteczki potomne</text><path d="M180 414L221 414" stroke="#4b655b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="292" y="421" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">stara nić</text><path d="M450 414L491 414" stroke="#e56640" stroke-width="7" fill="none" stroke-linecap="round"/><text x="575" y="421" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">nowa nić</text></g></svg>
