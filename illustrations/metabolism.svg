<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Dlaczego zmiana enzymu ma znaczenie?</title><desc id="desc">Substrat przechodzi z udziałem enzymu w produkt. Mniejsza aktywność enzymu może powodować gromadzenie substratu i niedobór produktu.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Enzym: jeden etap szlaku metabolicznego</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Słabsza aktywność enzymu może zmienić przemiany substancji.</text><rect x="38" y="205" width="180" height="65" rx="16" fill="#f9e6d9"/><text x="128.0" y="246" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">substrat</text><rect x="310" y="125" width="180" height="65" rx="16" fill="#edf0e4"/><text x="400.0" y="166" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">enzym</text><rect x="582" y="205" width="180" height="65" rx="16" fill="#f9e6d9"/><text x="672.0" y="246" text-anchor="middle" font-size="24" font-weight="600" fill="#28382f">produkt</text><path d="M235 238L563 238" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><path d="M400 195L400 223" stroke="#4b655b" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 5"/><text x="400" y="340" text-anchor="middle" font-size="23" font-weight="400" fill="#e56640">mniejsza aktywność enzymu</text><text x="222" y="389" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">substrat może</text><text x="222" y="416" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">się gromadzić</text><text x="584" y="389" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">produktu może</text><text x="584" y="416" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">powstawać mniej</text></g></svg>
