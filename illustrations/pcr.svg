<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Trzy etapy reakcji PCR</title><desc id="desc">Trzy etapy PCR: rozdzielenie nici około 95 stopni, przyłączenie starterów często w 50–65 stopniach i wydłużanie często około 72 stopni.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">PCR: powielanie wybranego fragmentu</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Cykl zwykle obejmuje trzy etapy i jest wielokrotnie powtarzany.</text><rect x="42" y="124" width="210" height="222" rx="16" fill="#edf0e4"/><circle cx="147" cy="163" r="23" fill="#f9e6d9"/><text x="147" y="171" text-anchor="middle" font-size="23" font-weight="600" fill="#e56640">1</text><text x="147" y="222" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">rozdzielenie nici</text><text x="147" y="266" text-anchor="middle" font-size="21" font-weight="600" fill="#4b655b">około 95°C</text><path d="M72 308L222 308" stroke="#e56640" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M72 324L222 324" stroke="#4b655b" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="295" y="124" width="210" height="222" rx="16" fill="#edf0e4"/><circle cx="400" cy="163" r="23" fill="#f9e6d9"/><text x="400" y="171" text-anchor="middle" font-size="23" font-weight="600" fill="#e56640">2</text><text x="400" y="211" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">przyłączenie</text><text x="400" y="235" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">starterów</text><text x="400" y="277" text-anchor="middle" font-size="21" font-weight="600" fill="#4b655b">często 50–65°C</text><path d="M325 308L475 308" stroke="#e56640" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M325 324L475 324" stroke="#4b655b" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="548" y="124" width="210" height="222" rx="16" fill="#edf0e4"/><circle cx="653" cy="163" r="23" fill="#f9e6d9"/><text x="653" y="171" text-anchor="middle" font-size="23" font-weight="600" fill="#e56640">3</text><text x="653" y="222" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">wydłużanie nici</text><text x="653" y="266" text-anchor="middle" font-size="21" font-weight="600" fill="#4b655b">około 72°C</text><path d="M578 308L728 308" stroke="#e56640" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M578 324L728 324" stroke="#4b655b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M259 236L287 236" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><path d="M512 236L540 236" fill="none" stroke="#4b655b" stroke-width="3" marker-end="url(#arr)"/><text x="400" y="398" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">Po wielu cyklach powstaje wiele kopii fragmentu DNA.</text><text x="400" y="435" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">Temperatury zależą od użytych odczynników i protokołu.</text></g></svg>
