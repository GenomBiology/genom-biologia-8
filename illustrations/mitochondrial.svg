<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Gdzie w komórce znajduje się DNA?</title><desc id="desc">Komórka z jądrem zawierającym DNA oraz mitochondrium z małą kolistą cząsteczką mtDNA.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4b655b"/></marker></defs><rect width="800" height="460" rx="24" fill="#f7f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" text-anchor="start" font-size="29" font-weight="600" fill="#28382f">Dwa miejsca przechowywania DNA</text><text x="38" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#53634f">Większość DNA jest w jądrze; mitochondria mają własne mtDNA.</text><ellipse cx="375" cy="257" rx="285" ry="150" fill="#edf0e4" stroke="#d9dfce" stroke-width="3"/><circle cx="290" cy="245" r="82" fill="#f9e6d9" stroke="#e56640" stroke-width="3"/><text x="290" y="235" text-anchor="middle" font-size="24" font-weight="400" fill="#28382f">jądro</text><text x="290" y="266" text-anchor="middle" font-size="20" font-weight="400" fill="#28382f">DNA jądrowe</text><ellipse cx="524" cy="278" rx="76" ry="44" transform="rotate(-20 524 278)" fill="#f7f5ee" stroke="#4b655b" stroke-width="3"/><path d="M468 281q18-52 34-3t30-7t33-3" fill="none" stroke="#4b655b" stroke-width="3"/><circle cx="531" cy="274" r="15" fill="none" stroke="#e56640" stroke-width="3"/><path d="M570 267L660 173" stroke="#4b655b" stroke-width="2" fill="none" stroke-linecap="round"/><text x="640" y="143" text-anchor="middle" font-size="21" font-weight="400" fill="#28382f">mitochondrium</text><path d="M531 292L610 363" stroke="#e56640" stroke-width="2" fill="none" stroke-linecap="round"/><text x="646" y="391" text-anchor="middle" font-size="23" font-weight="400" fill="#e56640">mtDNA</text><text x="400" y="439" text-anchor="middle" font-size="20" font-weight="400" fill="#53634f">mtDNA stanowi tylko małą część całego genomu człowieka.</text></g></svg>
